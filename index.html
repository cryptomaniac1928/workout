<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Журнал железа</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #111316; color: #EDEEF0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: calc(18px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: .06em; }
  .sub { color: #8A8F99; font-size: 12px; margin-top: 2px; }
  .muted { color: #8A8F99; font-size: 13px; }

  .dayCard {
    width: 100%; background: #1A1C21; border: 1px solid #24262C;
    border-radius: 12px; padding: 16px 14px; color: inherit;
    cursor: pointer; display: block; margin-bottom: 14px; text-align: left;
  }
  .dayCard:active { transform: scale(.985); }
  .dayRow { display: flex; align-items: center; gap: 14px; }
  .dayTitle { font-weight: 600; font-size: 16px; }

  .plate {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #111316; flex-shrink: 0;
    box-shadow: inset 0 0 0 4px rgba(0,0,0,.25);
  }
  .plate.sm { width: 30px; height: 30px; font-size: 14px; }

  .tipBox {
    margin-top: 6px; padding: 12px 14px; border-radius: 10px;
    background: #1A1C21; border: 1px dashed #2E323B;
    color: #8A8F99; font-size: 13px; line-height: 1.45;
  }

  .dayBanner {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; color: #111316;
  }
  .bannerDay { font-weight: 800; letter-spacing: .05em; }
  .bannerTitle { font-weight: 600; font-size: 15px; }

  .exCard {
    background: #1A1C21; border: 1px solid #24262C; border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .exName { font-weight: 600; font-size: 15px; line-height: 1.3; display: inline; }
  .exTarget { color: #8A8F99; font-size: 12px; margin-top: 2px; }
  .upBadge { font-size: 11px; font-weight: 700; white-space: nowrap; margin-left: 8px; }

  .lastRow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .lastLabel { font-size: 11px; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; }
  .chip {
    background: #22252B; border: 1px solid #2E323B; color: #B7BBC2;
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .chip:active { background: #2E323B; }

  .setsRow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .setChip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px solid; border-radius: 999px; padding: 4px 6px 4px 12px;
    font-size: 14px; font-weight: 600;
  }
  .delSet { background: none; border: none; color: #8A8F99; font-size: 15px; cursor: pointer; padding: 0 4px; line-height: 1; }

  .inputRow { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .numInput {
    width: 74px; background: #111316; border: 1px solid #2E323B;
    border-radius: 10px; color: #EDEEF0; padding: 12px 10px;
    font-size: 16px; text-align: center; outline: none;
  }
  .numInput:focus { border-color: #6B7280; }
  .times { color: #8A8F99; }
  .addBtn {
    flex: 1; border: none; border-radius: 10px; padding: 12px 8px;
    font-weight: 700; font-size: 14px; color: #111316; cursor: pointer;
  }
  .addBtn:active { filter: brightness(.9); }

  .primaryBtn {
    width: 100%; background: #EDEEF0; color: #111316; border: none; border-radius: 12px;
    padding: 15px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 18px;
  }
  .ghostBtn {
    background: none; border: 1px solid #2E323B; color: #B7BBC2;
    border-radius: 10px; padding: 9px 14px; font-size: 13px; cursor: pointer;
  }
  .ghostBtn.wide { width: 100%; padding: 13px; margin-top: 10px; }

  .histCard { background: #1A1C21; border: 1px solid #24262C; border-radius: 12px; margin-bottom: 10px; }
  .histHead {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: none; border: none; color: inherit; padding: 13px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .histBody { padding: 4px 14px 14px; }
  .histRow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid #22252B; font-size: 13px;
  }
  .histName { color: #B7BBC2; }
  .histSets { color: #EDEEF0; white-space: nowrap; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #EDEEF0; color: #111316; padding: 10px 18px;
    border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,.4); z-index: 50; white-space: nowrap;
  }
  .empty { color: #8A8F99; text-align: center; padding: 40px 0; font-size: 14px; }
  .linkBtn {
    background: none; border: none; color: #6B7280; font-size: 12px;
    cursor: pointer; padding: 2px 0; margin-left: 8px; text-decoration: underline;
  }
  .exHist { margin-top: 8px; border-top: 1px solid #22252B; }
  .exNote { color: #6B7280; font-size: 12px; margin-top: 6px; line-height: 1.4; }
  .optRow { display: flex; gap: 6px; flex-wrap: wrap; }
  .optBtn {
    background: #22252B; border: 1.5px solid #2E323B; color: #B7BBC2;
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .optBtn.on { color: #111316; }
  .dayTag { font-weight: 800; margin-right: 8px; }
  button:focus-visible, input:focus-visible { outline: 2px solid #6B7280; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── Каталог упражнений ───────────────────────────────────────────────────
// id — постоянный ключ истории. Меняешь название — история остаётся.
// type: base — запас 1 повтор; iso — последний подход можно в отказ; safe — без отказа.
const CATALOG = {
  smith_squat:  { name: "Присед в Смите", sets: 2, repMin: 8, repMax: 12, type: "base", note: "Стопы на 10–15 см впереди грифа, до параллели и ниже. Вдох перед повтором, выдох наверху" },
  incline_db:   { name: "Жим гантелей на наклонной 30°", sets: 2, repMin: 8, repMax: 12, type: "base" },
  cable_row:    { name: "Тяга горизонтального блока", sets: 2, repMin: 10, repMax: 12, type: "base", note: "Узкая нейтральная рукоять" },
  seated_press: { name: "Жим гантелей сидя", sets: 2, repMin: 8, repMax: 12, type: "base" },
  tri_french:   { name: "Французский жим гантелей на наклонной", sets: 2, repMin: 10, repMax: 15, type: "iso", note: "Скамья 30–45°. Локти смотрят в потолок и не разъезжаются, гантели опускаешь за голову до растяжения трицепса" },
  rev_fly:      { name: "Обратная бабочка", sets: 2, repMin: 15, repMax: 20, type: "iso" },
  neck_ext:     { name: "Разгибание шеи лёжа", sets: 2, repMin: 15, repMax: 20, type: "safe", note: "Лёжа лицом вниз, блин на затылке через полотенце. Первые 2–3 недели без веса" },
  neck_flex:    { name: "Сгибание шеи лёжа", sets: 2, repMin: 15, repMax: 20, type: "safe", note: "Лёжа на спине, блин на лбу через полотенце, подбородок к груди. Первые 2–3 недели без веса" },

  rdl:          { name: "Румынская тяга", sets: 2, repMin: 8, repMax: 12, type: "base" },
  pulldown:     { name: "Верхний блок / подтягивания, нейтральный хват", sets: 2, repMin: 6, repMax: 10, type: "base" },
  flat_db:      { name: "Жим гантелей лёжа", sets: 2, repMin: 8, repMax: 12, type: "base" },
  db_row:       { name: "Тяга гантели с упором в скамью", sets: 2, repMin: 8, repMax: 12, type: "base", note: "Колено и рука на скамье, поясница разгружена" },
  shrug:        { name: "Шраги с гантелями", sets: 2, repMin: 12, repMax: 15, type: "iso", note: "Строго вверх, без вращений, голову не выносить вперёд" },
  curl_incline: { name: "Сгибания гантелей на наклонной скамье", sets: 2, repMin: 10, repMax: 12, type: "iso", note: "Скамья 45–60°, руки свисают за корпусом. Локти не уводи вперёд, внизу полное разгибание" },
  lat_raise:    { name: "Махи гантелей в стороны", sets: 2, repMin: 15, repMax: 20, type: "iso" },

  leg_press:    { name: "Жим ногами", sets: 2, repMin: 8, repMax: 12, type: "base" },
  leg_curl:     { name: "Сгибания ног в тренажёре", sets: 2, repMin: 10, repMax: 15, type: "iso", note: "Сидя, если есть такой тренажёр" },
  leg_ext:      { name: "Разгибания ног в тренажёре", sets: 2, repMin: 10, repMax: 15, type: "iso", note: "Если спинка регулируется — откинь её назад, так сильнее растягивается прямая мышца бедра" },
  incline_db_n: { name: "Жим гантелей на наклонной 30°, нейтральный хват", sets: 2, repMin: 8, repMax: 12, type: "base", note: "Ладони смотрят друг на друга. Внизу пауза в растяжении, без отбива" },
  pec_deck:     { name: "Бабочка", sets: 2, repMin: 10, repMax: 15, type: "iso" },
  pulldown_c:   { name: "Верхний блок узким хватом", sets: 2, repMin: 10, repMax: 12, type: "base" },
  face_pull:    { name: "Face pull", sets: 2, repMin: 15, repMax: 20, type: "iso", note: "Верхний блок, канат, тянешь к лбу, локти вверх и в стороны" },
  calf:         { name: "Икры в жиме ногами", sets: 2, repMin: 12, repMax: 15, type: "safe", note: "Подушечки стоп целиком на нижнем краю платформы, колени почти прямые. Внизу пауза 1–2 сек в растяжении" },

  // выведены из программы — нужны только для истории
  vsquat:       { name: "V-Squat (Super Squat)", retired: true },
  neck_side:    { name: "Боковые наклоны шеи лёжа", retired: true },
  incline_45:   { name: "Жим штанги на наклонной 45°", retired: true },
  incline_bb30: { name: "Жим штанги на наклонной 30°", retired: true },
  curl:         { name: "Сгибания на бицепс", retired: true },
  crunch:       { name: "Скручивания на коврике", retired: true },
  plank:        { name: "Планка", retired: true, unit: "сек" },
  oh_tri_ext:   { name: "Жим гантели из-за головы сидя", retired: true },
  bulgarian:    { name: "Болгарские сплит-приседы", retired: true, unit: "" },
  dips:         { name: "Брусья / жим в наклоне", retired: true },
  y_raise:      { name: "Y-raise на наклонной", retired: true },
};

const PROGRAM = {
  A: { title: "Жимы + квадрицепс", color: "#E5484D", exercises: [
    { id: "smith_squat" }, { id: "incline_db" }, { id: "cable_row" }, { id: "seated_press" },
    { id: "tri_french" }, { id: "rev_fly" }, { id: "neck_ext" }, { id: "neck_flex" },
  ]},
  B: { title: "Тяги + задняя цепь", color: "#3E7BFA", exercises: [
    { id: "rdl" }, { id: "pulldown" }, { id: "flat_db" }, { id: "db_row" },
    { id: "rev_fly" }, { id: "shrug" }, { id: "curl_incline" }, { id: "lat_raise" },
  ]},
  C: { title: "Ноги + слабые места", color: "#F0B429", exercises: [
    { id: "leg_press" }, { id: "leg_curl" }, { id: "leg_ext" },
    { options: ["incline_db_n", "pec_deck"], note: "Чередуй через тренировку — приложение само предложит нужное" },
    { id: "pulldown_c" }, { id: "face_pull" }, { id: "calf" },
  ]},
};

// Старая программа: записи хранились по номеру упражнения в дне
const LEGACY = {
  A: ["vsquat", "incline_db", "cable_row", "seated_press", "rev_fly", "oh_tri_ext", "crunch"],
  B: ["rdl", "pulldown", "flat_db", "db_row", "rev_fly", "curl", "lat_raise"],
  C: ["leg_press", "bulgarian", "dips", "pulldown_c", "y_raise", "calf", "plank"],
};

// прежние варианты того же слота — для чередования в дне C
const ALIASES = { incline_db_n: ["incline_bb30", "incline_45", "incline_db"] };

const SESSIONS_KEY = "gymlog-sessions-v1";
const BACKUP_KEY = "gymlog-sessions-v1-backup";
const DRAFT_KEY = "gymlog-draft-v1";

// ─── Состояние ────────────────────────────────────────────────────────────
let state = { view: "home", day: null, entries: {}, choice: {}, expanded: null };
let sessions = [];
let exOpen = {};

function migrateEntries(day, entries) {
  const out = {};
  const map = LEGACY[day] || [];
  for (const [k, sets] of Object.entries(entries || {})) {
    const id = /^\d+$/.test(k) ? map[+k] : k;
    if (id && sets && sets.length) out[id] = (out[id] || []).concat(sets);
  }
  return out;
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(SESSIONS_KEY); sessions = JSON.parse(raw) || []; } catch (e) { sessions = []; }
  if (sessions.some(s => s.v !== 2)) {
    try { if (raw && !localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw); } catch (e) {}
    sessions = sessions.map(s => s.v === 2 ? s : { ...s, v: 2, entries: migrateEntries(s.day, s.entries) });
    saveSessions();
  }
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (d && d.day && PROGRAM[d.day]) {
      const entries = d.v === 2 ? d.entries : migrateEntries(d.day, d.entries);
      state = { view: "workout", day: d.day, entries: entries || {}, choice: d.choice || defaultChoice(d.day), expanded: null };
      setTimeout(() => toast("Продолжаем незаконченную тренировку"), 300);
    }
  } catch (e) {}
}
function saveSessions() { try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); } catch (e) { toast("Не удалось сохранить: память браузера недоступна"); } }
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ v: 2, day: state.day, entries: state.entries, choice: state.choice })); } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

// ─── Утилиты ──────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtDate = (iso) => new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
const fmtSet = (s, unit) => s.w ? `${s.w}×${s.r}` : `${s.r}${unit ? " " + unit : ""}`;
const lastSession = (d) => sessions.find(s => s.day === d) || null;
const lastWith = (id) => sessions.find(s => s.entries[id] && s.entries[id].length) || null;
const ruleText = (t) => t === "base" ? "запас 1 повтор" : t === "iso" ? "последний можно в отказ" : "без отказа";

function defaultChoice(d) {
  const choice = {};
  PROGRAM[d].exercises.forEach((slot, i) => {
    if (!slot.options) return;
    const has = (s, o) => [o, ...(ALIASES[o] || [])].some(k => s.entries[k] && s.entries[k].length);
    const prev = sessions.find(s => s.day === d && slot.options.some(o => has(s, o)));
    if (!prev) { choice[i] = slot.options[0]; return; }
    const used = slot.options.findIndex(o => has(prev, o));
    choice[i] = slot.options[(used + 1) % slot.options.length];
  });
  return choice;
}
function slotId(i) {
  const slot = PROGRAM[state.day].exercises[i];
  return slot.options ? (state.choice[i] || slot.options[0]) : slot.id;
}

function progressionHint(id) {
  const ex = CATALOG[id];
  const last = lastWith(id);
  if (!last || !ex.sets) return false;
  const sets = last.entries[id];
  return sets.length >= ex.sets && sets.every(s => s.r >= ex.repMax);
}

let toastTimer = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(el => el.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2500);
}

// ─── Действия ─────────────────────────────────────────────────────────────
function go(view) { state.view = view; state.expanded = null; render(); }
function startWorkout(d) { exOpen = {}; state = { view: "workout", day: d, entries: {}, choice: defaultChoice(d), expanded: null }; render(); }
function toggleExHist(i) { exOpen[i] = !exOpen[i]; render(); }
function choose(i, id) { state.choice[i] = id; exOpen[i] = false; saveDraft(); render(); }

function addSet(i) {
  const wEl = document.getElementById("w" + i), rEl = document.getElementById("r" + i);
  const r = parseFloat(rEl.value.replace(",", "."));
  if (!r) { rEl.focus(); return; }
  const w = parseFloat(wEl.value.replace(",", ".")) || 0;
  const id = slotId(i);
  (state.entries[id] = state.entries[id] || []).push({ w, r });
  rEl.value = "";
  saveDraft(); render();
}
function removeSet(i, si) {
  const id = slotId(i);
  state.entries[id].splice(si, 1);
  if (!state.entries[id].length) delete state.entries[id];
  saveDraft(); render();
}
function prefill(i, w, r) {
  document.getElementById("w" + i).value = w || "";
  document.getElementById("r" + i).value = r;
}
function finishWorkout() {
  const entries = {};
  for (const [id, sets] of Object.entries(state.entries)) if (sets && sets.length) entries[id] = sets;
  if (!Object.keys(entries).length) { toast("Запиши хотя бы один подход"); return; }
  sessions.unshift({ v: 2, id: Date.now(), date: new Date().toISOString(), day: state.day, entries });
  saveSessions(); clearDraft();
  state = { view: "home", day: null, entries: {}, choice: {}, expanded: null };
  render(); toast("Тренировка сохранена 💪");
}
function cancelWorkout() {
  clearDraft();
  state = { view: "home", day: null, entries: {}, choice: {}, expanded: null };
  render();
}
function toggleHist(id) { state.expanded = state.expanded === id ? null : id; render(); }

// порядок упражнений в истории: как в текущей программе дня, выведенные — в конце
function orderedIds(day, entries) {
  const seq = [];
  (PROGRAM[day]?.exercises || []).forEach(sl => (sl.options || [sl.id]).forEach(id => { if (!seq.includes(id)) seq.push(id); }));
  const keys = Object.keys(entries);
  return [...seq.filter(id => keys.includes(id)), ...keys.filter(id => !seq.includes(id))];
}

// ─── Рендер ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  const savedInputs = {};
  document.querySelectorAll(".numInput").forEach(el => { if (el.value) savedInputs[el.id] = el.value; });
  let html = `<header><div><div class="brand">ЖУРНАЛ ЖЕЛЕЗА</div>
    <div class="sub">Full Body 3×, два рабочих подхода</div></div>`;
  if (state.view === "home" && sessions.length)
    html += `<button class="ghostBtn" onclick="go('history')">История</button>`;
  if (state.view === "history")
    html += `<button class="ghostBtn" onclick="go('home')">Назад</button>`;
  html += `</header>`;

  if (state.view === "home") {
    for (const [key, p] of Object.entries(PROGRAM)) {
      const last = lastSession(key);
      html += `<button class="dayCard" style="border-left:6px solid ${p.color}" onclick="startWorkout('${key}')">
        <div class="dayRow">
          <span class="plate" style="background:${p.color}">${key}</span>
          <div style="flex:1">
            <div class="dayTitle">${esc(p.title)}</div>
            <div class="muted">${last ? "Последняя: " + fmtDate(last.date) : "Ещё не выполнялась"}</div>
          </div>
          <span class="muted" style="font-size:20px">›</span>
        </div></button>`;
    }
    html += `<div class="tipBox">Записывай только рабочие подходы. Разминку (50% × 8–10, затем 75% × 3–5) не вноси — иначе сломается подсказка прогрессии.<br><br>
      Базовые — запас 1 повтор до отказа. Изоляция — последний подход можно в отказ.
      Дошёл до верха диапазона в обоих подходах — на следующей тренировке +2,5–5 кг.<br><br>
      Закружилась голова — подход сразу прекращай, садись.</div>`;
  }

  if (state.view === "workout") {
    const p = PROGRAM[state.day];
    html += `<div class="dayBanner" style="background:${p.color}">
      <span class="bannerDay">ДЕНЬ ${state.day}</span><span class="bannerTitle">${esc(p.title)}</span></div>`;
    p.exercises.forEach((slot, i) => {
      const id = slotId(i);
      const ex = CATALOG[id];
      const sets = state.entries[id] || [];
      const lastS = lastWith(id);
      const last = lastS ? lastS.entries[id] : null;
      const note = slot.note || ex.note;
      html += `<div class="exCard">`;
      if (slot.options) {
        html += `<div class="optRow">` + slot.options.map(o =>
          `<button class="optBtn${o === id ? " on" : ""}" style="${o === id ? `background:${p.color};border-color:${p.color}` : ""}" onclick="choose(${i},'${o}')">${esc(CATALOG[o].name)}</button>`
        ).join("") + `</div>`;
      } else {
        html += `<div><span class="exName">${esc(ex.name)}</span>`;
      }
      if (slot.options) html += `<div>`;
      html += progressionHint(id) ? `<span class="upBadge" style="color:${p.color}">↑ добавь вес</span>` : "";
      html += `</div>`;
      html += `<div class="exTarget">План: ${ex.sets} × ${ex.repMin}–${ex.repMax}${ex.unit ? " " + ex.unit : ""}, ${ruleText(ex.type)}<button class="linkBtn" onclick="toggleExHist(${i})">${exOpen[i] ? "скрыть ▴" : "вся история ▾"}</button></div>`;
      if (note) html += `<div class="exNote">${esc(note)}</div>`;
      if (exOpen[i]) {
        const hist = sessions.filter(s => s.entries[id] && s.entries[id].length);
        html += `<div class="exHist">` + (hist.length
          ? hist.map(s => `<div class="histRow"><span class="histName"><span class="dayTag" style="color:${PROGRAM[s.day]?.color || "#8A8F99"}">${s.day}</span>${fmtDate(s.date)}</span><span class="histSets">${s.entries[id].map(x => fmtSet(x, ex.unit)).join(" · ")}</span></div>`).join("")
          : `<div class="muted" style="padding:8px 0 4px">Записей ещё нет</div>`) + `</div>`;
      }
      if (last) {
        html += `<div class="lastRow"><span class="lastLabel">прошлый раз</span>`;
        last.forEach(s => { html += `<button class="chip" onclick="prefill(${i},${s.w},${s.r})">${fmtSet(s, ex.unit)}</button>`; });
        html += `</div>`;
      }
      if (sets.length) {
        html += `<div class="setsRow">`;
        sets.forEach((s, si) => {
          html += `<span class="setChip" style="border-color:${p.color}">${fmtSet(s, ex.unit)}
            <button class="delSet" onclick="removeSet(${i},${si})">×</button></span>`;
        });
        html += `</div>`;
      }
      html += `<div class="inputRow">
        <input class="numInput" id="w${i}" type="text" inputmode="decimal" placeholder="кг">
        <span class="times">×</span>
        <input class="numInput" id="r${i}" type="text" inputmode="numeric" placeholder="${ex.unit || "повт"}">
        <button class="addBtn" style="background:${p.color}" onclick="addSet(${i})">+ подход</button>
      </div></div>`;
    });
    html += `<button class="primaryBtn" onclick="finishWorkout()">Завершить и сохранить</button>
      <button class="ghostBtn wide" onclick="cancelWorkout()">Отменить без сохранения</button>`;
  }

  if (state.view === "history") {
    if (!sessions.length) html += `<div class="empty">Пока пусто. Первая тренировка всё изменит.</div>`;
    sessions.forEach(s => {
      const p = PROGRAM[s.day] || { title: "Тренировка", color: "#8A8F99" };
      const open = state.expanded === s.id;
      html += `<div class="histCard">
        <button class="histHead" onclick="toggleHist(${s.id})">
          <span class="plate sm" style="background:${p.color}">${s.day}</span>
          <span style="flex:1;text-align:left">${esc(p.title)}</span>
          <span class="muted">${fmtDate(s.date)}</span>
          <span class="muted" style="margin-left:8px">${open ? "▴" : "▾"}</span>
        </button>`;
      if (open) {
        html += `<div class="histBody">`;
        orderedIds(s.day, s.entries).forEach(id => {
          const ex = CATALOG[id] || { name: id };
          html += `<div class="histRow"><span class="histName">${esc(ex.name)}</span>
            <span class="histSets">${s.entries[id].map(x => fmtSet(x, ex.unit)).join(" · ")}</span></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  app.innerHTML = html;
  Object.entries(savedInputs).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (el && !el.value) el.value = v;
  });
}

// ─── Запуск ───────────────────────────────────────────────────────────────
loadData();
render();

// Service worker для офлайн-режима (работает только по https / GitHub Pages)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
